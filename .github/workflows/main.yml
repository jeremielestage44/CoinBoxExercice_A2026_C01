name: Python CoinBox Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest and generate coverage
      run: |
        pytest --cov=. --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml

    - name: Publish coverage report to build summary
      if: always()
      run: |
        echo "### Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
        python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || echo "No coverage data generated" >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage HTML report artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage-report
        path: htmlcov/
        retention-days: 14
